name: Quality Checks

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:
    inputs:
      strict:
        type: boolean
        default: false

jobs:
  quality:
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bun run format:check

      - name: Lint (warnings allowed)
        if: ${{ !inputs.strict }}
        run: bun run lint --max-warnings 10

      - name: Lint (strict)
        if: ${{ inputs.strict }}
        run: bun run lint

      - name: Type check
        run: bun run typecheck
        continue-on-error: true # TODO: Fix TypeScript errors and remove this
