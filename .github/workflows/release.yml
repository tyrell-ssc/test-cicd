name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  version-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      version_type: ${{ steps.parse.outputs.type }}
      is_patch: ${{ steps.parse.outputs.is_patch }}
      is_minor: ${{ steps.parse.outputs.is_minor }}
      is_major: ${{ steps.parse.outputs.is_major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version
        id: parse
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.0")
          PREV_VERSION=${PREV_TAG#v}

          # Parse versions
          IFS='.' read -r -a current <<< "$VERSION"
          IFS='.' read -r -a previous <<< "$PREV_VERSION"

          # Determine version type
          if [ "${previous[0]}" != "${current[0]}" ]; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "is_major=true" >> $GITHUB_OUTPUT
          elif [ "${previous[1]}" != "${current[1]}" ]; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "is_minor=true" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "is_patch=true" >> $GITHUB_OUTPUT
          fi

  check-deployment-setup:
    name: Check Deployment Setup
    runs-on: ubuntu-latest
    outputs:
      # needs_setup: ${{ steps.check.outputs.needs_setup }}
      setup_staging: ${{ steps.check.outputs.setup_staging }}
      setup_prod: ${{ steps.check.outputs.setup_prod }}
    steps:
      - name: Check if Netlify sites are configured
        id: check
        run: |
          # --- CHECK STAGING ---
          if [ -z "${{ secrets.NETLIFY_WEB_SITE_ID_STAGING }}" ] || [ -z "${{ secrets.NETLIFY_ADMIN_SITE_ID_STAGING }}" ]; then
            echo "setup_staging=true" >> $GITHUB_OUTPUT
            echo "⚠️ Staging needs setup."
          else
            echo "setup_staging=false" >> $GITHUB_OUTPUT
            echo "✅ Staging ready."
          fi

          # --- CHECK PRODUCTION ---
          if [ -z "${{ secrets.NETLIFY_WEB_SITE_ID_PRODUCTION }}" ] || [ -z "${{ secrets.NETLIFY_ADMIN_SITE_ID_PRODUCTION }}" ]; then
            echo "setup_prod=true" >> $GITHUB_OUTPUT
            echo "⚠️ Production needs setup."
          else
            echo "setup_prod=false" >> $GITHUB_OUTPUT
            echo "✅ Production ready."
          fi
          echo "✅ Netlify sites already configured."
        # run: |
        #       if [ -z "${{ secrets.NETLIFY_WEB_SITE_ID_PRODUCTION }}" ]; then
        #       echo "needs_setup=true" >> $GITHUB_OUTPUT
        #       echo "⚠️  Netlify sites not configured. Will run setup first."
        #       exit 0
        #       fi
        #       if [ -z "${{ secrets.NETLIFY_ADMIN_SITE_ID_PRODUCTION }}" ]; then
        #       echo "needs_setup=true" >> $GITHUB_OUTPUT
        #       echo "⚠️  Netlify sites not configured. Will run setup first."
        #       exit 0
        #       fi
        #       echo "needs_setup=false" >> $GITHUB_OUTPUT
        # echo "✅ Netlify sites already configured."
  # setup-deployment:
  #   name: Setup Deployment (First Run)
  #   needs: check-deployment-setup
  #   if: needs.check-deployment-setup.outputs.needs_setup == 'true'
  #   uses: ./.github/workflows/setup-deployment.yml
  #   secrets: inherit
  #   with:
  #     environment: production
  setup-staging:
    needs: check-deployment
    # Only run if check-deployment said staging was missing
    if: needs.check-deployment.outputs.setup_staging == 'true'
    uses: ./.github/workflows/setup-deployment.yml
    secrets: inherit
    with:
      environment: staging

  setup-prod:
    needs: check-deployment
    # Only run if check-deployment said prod was missing
    if: needs.check-deployment.outputs.setup_prod == 'true'
    uses: ./.github/workflows/setup-deployment.yml
    secrets: inherit
    with:
      environment: production
  quality-patch:
    needs: [version-info, check-deployment-setup, setup-deployment]
    if: |
      always() &&
      (needs.setup-deployment.result == 'success' || needs.setup-deployment.result == 'skipped') &&
      needs.version-info.outputs.is_patch == 'true'
    uses: ./.github/workflows/quality-checks.yml
    with:
      strict: false

  quality-minor-major:
    needs: [version-info, check-deployment-setup, setup-deployment]
    if: |
      always() &&
      (needs.setup-deployment.result == 'success' || needs.setup-deployment.result == 'skipped') &&
      (needs.version-info.outputs.is_minor == 'true' ||
       needs.version-info.outputs.is_major == 'true')
    uses: ./.github/workflows/quality-checks.yml
    with:
      strict: true

  tests:
    needs: [version-info, quality-minor-major]
    if: |
      needs.version-info.outputs.is_minor == 'true' ||
      needs.version-info.outputs.is_major == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Run tests
        run: bun run test

      # E2E only for major
      - name: Run E2E tests
        if: needs.version-info.outputs.is_major == 'true'
        run: bun run test:e2e

  deploy-web-staging:
    needs: [version-info, setup-staging, lint, unit-tests, e2e-tests]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.setup-staging.result == 'success' || needs.setup-staging.result == 'skipped') &&
      (needs.version-info.outputs.is_patch == 'true' || needs.unit-tests.result == 'success') &&
      (needs.version-info.outputs.is_major != 'true' || needs.e2e-tests.result == 'success')
    uses: ./.github/workflows/deploy-web.yml
    with:
      app_name: 'web'
      environment: 'staging'
      # ✅ THE FIX: Use Output OR Fallback to Secret (if setup was skipped)
      site_id: ${{ needs.setup-staging.outputs.web_site_id || secrets.NETLIFY_WEB_SITE_ID_STAGING }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-web-prod:
    needs: [version-info, setup-prod, lint, unit-tests, e2e-tests]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.setup-prod.result == 'success' || needs.setup-prod.result == 'skipped') &&
      (needs.version-info.outputs.is_patch == 'true' || needs.unit-tests.result == 'success') &&
      (needs.version-info.outputs.is_major != 'true' || needs.e2e-tests.result == 'success')
    uses: ./.github/workflows/deploy-web.yml
    with:
      app_name: 'web'
      environment: 'production'
      # ✅ THE FIX: Use Output OR Fallback to Secret
      site_id: ${{ needs.setup-prod.outputs.web_site_id || secrets.NETLIFY_WEB_SITE_ID_PRODUCTION }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      deploy-web-staging:
    needs: [version-info, setup-staging, lint, unit-tests, e2e-tests]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.setup-staging.result == 'success' || needs.setup-staging.result == 'skipped') &&
      (needs.version-info.outputs.is_patch == 'true' || needs.unit-tests.result == 'success') &&
      (needs.version-info.outputs.is_major != 'true' || needs.e2e-tests.result == 'success')
    uses: ./.github/workflows/deploy-web.yml
    with:
      app_name: 'web'
      environment: 'staging'
      # ✅ THE FIX: Use Output OR Fallback to Secret (if setup was skipped)
      site_id: ${{ needs.setup-staging.outputs.web_site_id || secrets.NETLIFY_WEB_SITE_ID_STAGING }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-admin-staging:
    needs: [version-info, setup-staging, lint, unit-tests, e2e-tests]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.setup-staging.result == 'success' || needs.setup-staging.result == 'skipped') &&
      (needs.version-info.outputs.is_patch == 'true' || needs.unit-tests.result == 'success') &&
      (needs.version-info.outputs.is_major != 'true' || needs.e2e-tests.result == 'success')
    uses: ./.github/workflows/deploy-web.yml
    with:
      app_name: 'admin'
      environment: 'staging'
      # ✅ THE FIX: Use Output OR Fallback to Secret (if setup was skipped)
      site_id: ${{ needs.setup-staging.outputs.admin_site_id || secrets.NETLIFY_ADMIN_SITE_ID_STAGING }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-admin-prod:
    needs: [version-info, setup-prod, lint, unit-tests, e2e-tests]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.setup-prod.result == 'success' || needs.setup-prod.result == 'skipped') &&
      (needs.version-info.outputs.is_patch == 'true' || needs.unit-tests.result == 'success') &&
      (needs.version-info.outputs.is_major != 'true' || needs.e2e-tests.result == 'success')
    uses: ./.github/workflows/deploy-web.yml
    with:
      app_name: 'admin'
      environment: 'production'
      # ✅ THE FIX: Use Output OR Fallback to Secret
      site_id: ${{ needs.setup-prod.outputs.admin_site_id || secrets.NETLIFY_ADMIN_SITE_ID_PRODUCTION }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
