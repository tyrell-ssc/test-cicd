name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  version-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      version_type: ${{ steps.parse.outputs.type }}
      is_patch: ${{ steps.parse.outputs.is_patch }}
      is_minor: ${{ steps.parse.outputs.is_minor }}
      is_major: ${{ steps.parse.outputs.is_major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version
        id: parse
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.0")
          PREV_VERSION=${PREV_TAG#v}

          # Parse versions
          IFS='.' read -r -a current <<< "$VERSION"
          IFS='.' read -r -a previous <<< "$PREV_VERSION"

          # Determine version type
          if [ "${previous[0]}" != "${current[0]}" ]; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "is_major=true" >> $GITHUB_OUTPUT
          elif [ "${previous[1]}" != "${current[1]}" ]; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "is_minor=true" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "is_patch=true" >> $GITHUB_OUTPUT
          fi

  check-deployment-setup:
    name: Check Deployment Setup
    runs-on: ubuntu-latest
    outputs:
      setup_staging: ${{ steps.check.outputs.setup_staging }}
      setup_prod: ${{ steps.check.outputs.setup_prod }}
    steps:
      - name: Check if Netlify sites are configured
        id: check
        run: |
          # --- CHECK STAGING ---
          if [ -z "${{ secrets.NETLIFY_WEB_SITE_ID_STAGING }}" ] || [ -z "${{ secrets.NETLIFY_ADMIN_SITE_ID_STAGING }}" ]; then
            echo "setup_staging=true" >> $GITHUB_OUTPUT
            echo "⚠️ Staging needs setup."
          else
            echo "setup_staging=false" >> $GITHUB_OUTPUT
            echo "✅ Staging ready."
          fi

          # --- CHECK PRODUCTION ---
          if [ -z "${{ secrets.NETLIFY_WEB_SITE_ID_PRODUCTION }}" ] || [ -z "${{ secrets.NETLIFY_ADMIN_SITE_ID_PRODUCTION }}" ]; then
            echo "setup_prod=true" >> $GITHUB_OUTPUT
            echo "⚠️ Production needs setup."
          else
            echo "setup_prod=false" >> $GITHUB_OUTPUT
            echo "✅ Production ready."
          fi

  setup-staging:
    needs: check-deployment-setup
    if: needs.check-deployment-setup.outputs.setup_staging == 'true'
    uses: ./.github/workflows/setup-deployment.yml
    secrets: inherit
    with:
      environment: staging

  setup-prod:
    needs: check-deployment-setup
    if: needs.check-deployment-setup.outputs.setup_prod == 'true'
    uses: ./.github/workflows/setup-deployment.yml
    secrets: inherit
    with:
      environment: production

  quality-patch:
    needs: [version-info, check-deployment-setup, setup-staging, setup-prod]
    if: |
      always() &&
      (needs.setup-staging.result == 'success' || needs.setup-staging.result == 'skipped') &&
      (needs.setup-prod.result == 'success' || needs.setup-prod.result == 'skipped') &&
      needs.version-info.outputs.is_patch == 'true'
    uses: ./.github/workflows/quality-checks.yml
    with:
      strict: false

  quality-minor-major:
    needs: [version-info, check-deployment-setup, setup-staging, setup-prod]
    if: |
      always() &&
      (needs.setup-staging.result == 'success' || needs.setup-staging.result == 'skipped') &&
      (needs.setup-prod.result == 'success' || needs.setup-prod.result == 'skipped') &&
      (needs.version-info.outputs.is_minor == 'true' ||
       needs.version-info.outputs.is_major == 'true')
    uses: ./.github/workflows/quality-checks.yml
    with:
      strict: true

  tests:
    needs: [version-info, quality-minor-major]
    if: |
      needs.version-info.outputs.is_minor == 'true' ||
      needs.version-info.outputs.is_major == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Run tests
        run: bun run test

      # E2E only for major
      - name: Run E2E tests
        if: needs.version-info.outputs.is_major == 'true'
        run: bun run test:e2e

  deploy-web-staging:
    needs: [version-info, setup-staging, quality-patch, quality-minor-major, tests]
    if: |
      always() &&
      (needs.quality-patch.result == 'success' || needs.quality-minor-major.result == 'success') &&
      (needs.setup-staging.result == 'success' || needs.setup-staging.result == 'skipped') &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yaml
    with:
      app_name: 'web'
      environment: 'staging'
      site_id_from_setup: ${{ needs.setup-staging.outputs.web_site_id }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_ID_FROM_SECRET: ${{ secrets.NETLIFY_WEB_SITE_ID_STAGING }}

  deploy-web-prod:
    needs: [version-info, setup-prod, quality-patch, quality-minor-major, tests]
    if: |
      always() &&
      (needs.quality-patch.result == 'success' || needs.quality-minor-major.result == 'success') &&
      (needs.setup-prod.result == 'success' || needs.setup-prod.result == 'skipped') &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yaml
    with:
      app_name: 'web'
      environment: 'production'
      site_id_from_setup: ${{ needs.setup-prod.outputs.web_site_id }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_ID_FROM_SECRET: ${{ secrets.NETLIFY_WEB_SITE_ID_PRODUCTION }}

  deploy-admin-staging:
    needs: [version-info, setup-staging, quality-patch, quality-minor-major, tests]
    if: |
      always() &&
      (needs.quality-patch.result == 'success' || needs.quality-minor-major.result == 'success') &&
      (needs.setup-staging.result == 'success' || needs.setup-staging.result == 'skipped') &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yaml
    with:
      app_name: 'admin'
      environment: 'staging'
      site_id_from_setup: ${{ needs.setup-staging.outputs.admin_site_id }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_ID_FROM_SECRET: ${{ secrets.NETLIFY_ADMIN_SITE_ID_STAGING }}

  deploy-admin-prod:
    needs: [version-info, setup-prod, quality-patch, quality-minor-major, tests]
    if: |
      always() &&
      (needs.quality-patch.result == 'success' || needs.quality-minor-major.result == 'success') &&
      (needs.setup-prod.result == 'success' || needs.setup-prod.result == 'skipped') &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yaml
    with:
      app_name: 'admin'
      environment: 'production'
      site_id_from_setup: ${{ needs.setup-prod.outputs.admin_site_id }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_ID_FROM_SECRET: ${{ secrets.NETLIFY_ADMIN_SITE_ID_PRODUCTION }}

