name: Deploy Web/Admin

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: "App name (web or admin)"
      environment:
        required: true
        type: string
        description: "production or staging"
      site_id_from_setup:
        required: false
        type: string
        description: "The Netlify Site ID from setup job output (falls back to SITE_ID_FROM_SECRET)"
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Build Project
        env:
          VITE_APP_ENV: ${{ inputs.environment }}
          NODE_ENV: production
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          # Load _PRODUCTION secrets as base defaults (e.g. SUPABASE_URL_PRODUCTION → VITE_SUPABASE_URL)
          while IFS= read -r line; do
            export "VITE_$line"
          done < <(echo "$SECRETS_JSON" | jq -r '
            to_entries[]
            | select(.key | endswith("_PRODUCTION"))
            | "\(.key | rtrimstr("_PRODUCTION"))=\(.value)"
          ')

          # For staging: override with _STAGING variants where they exist
          if [ "${{ inputs.environment }}" = "staging" ]; then
            while IFS= read -r line; do
              export "VITE_$line"
            done < <(echo "$SECRETS_JSON" | jq -r '
              to_entries[]
              | select(.key | endswith("_STAGING"))
              | "\(.key | rtrimstr("_STAGING"))=\(.value)"
            ')
          fi

          echo "Building ${{ inputs.app_name }}..."
          bun run build:${{ inputs.app_name }}:${{ inputs.environment }}

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ID_INPUT: ${{ inputs.site_id_from_setup }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          if [ -n "$ID_INPUT" ]; then
            NETLIFY_SITE_ID="$ID_INPUT"
            echo "Using Site ID from setup output."
          else
            # Dynamically look up NETLIFY_{APP}_SITE_ID_{ENV} from repo secrets
            APP_UPPER=$(echo "${{ inputs.app_name }}" | tr '[:lower:]' '[:upper:]')
            ENV_UPPER=$(echo "${{ inputs.environment }}" | tr '[:lower:]' '[:upper:]')
            SECRET_KEY="NETLIFY_${APP_UPPER}_SITE_ID_${ENV_UPPER}"
            NETLIFY_SITE_ID=$(echo "$SECRETS_JSON" | jq -r --arg key "$SECRET_KEY" '.[$key] // ""')

            if [ -n "$NETLIFY_SITE_ID" ]; then
              echo "Using Site ID from repository secrets ($SECRET_KEY)."
            else
              echo "❌ Error: No Site ID found. Set ${SECRET_KEY} in repository secrets."
              exit 1
            fi
          fi

          echo "Deploying ${{ inputs.app_name }} to Site ID: $NETLIFY_SITE_ID"

          PACKAGE_NAME=$(jq -r '.name' "apps/${{ inputs.app_name }}/package.json")
          DEPLOY_DIR="$(pwd)/apps/${{ inputs.app_name }}/dist"

          NETLIFY_SITE_ID=$NETLIFY_SITE_ID netlify deploy \
            --filter="$PACKAGE_NAME" \
            --no-build \
            --dir="$DEPLOY_DIR" \
            --prod