name: Mobile Full Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v1
      - run: bun install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd apps/mobile
          bun run prebuild:production
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v1
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v1
      - run: bun install

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: cd apps/mobile/ios && pod install

      - name: Build iOS
        run: |
          cd apps/mobile
          bun run prebuild:production
          cd ios
          xcodebuild -workspace test-cicd.xcworkspace \
                     -scheme test-cicd \
                     -configuration Release \
                     -archivePath $PWD/build/test-cicd.xcarchive \
                     archive

      - name: Export IPA
        run: |
          cd apps/mobile/ios
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/test-cicd.xcarchive \
                     -exportPath $PWD/build \
                     -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/mobile/ios/build/*.ipa

      - name: Create Release
        if: github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v1
        with:
          files: apps/mobile/ios/build/*.ipa
          tag_name: ${{ github.ref_name }}
